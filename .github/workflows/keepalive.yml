name: 스케줄 유지

# GitHub는 60일간 커밋이 없는 저장소의 예약 실행을 자동으로 끈다.
# 매달 1일에 작은 커밋을 남겨 감시가 멈추지 않게 한다.
on:
  schedule:
    - cron: "0 18 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          date -u +"%Y-%m-%d" > .keepalive
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .keepalive
          git diff --staged --quiet || git commit -m "keepalive"
          git push
